<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 4 reading</title><style>:root{--main:#8860ae;--soft:#f5ecfb}*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f6f8fb;color:#203047;margin:0}.wrap{max-width:850px;margin:35px auto;padding:0 16px}.panel{background:white;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 35px #24364b12}.tag{display:inline-block;color:var(--main);background:var(--soft);border-radius:30px;padding:7px 15px;font-weight:700}.title{font-size:clamp(28px,5vw,40px);color:var(--main);margin:18px 0}.sub{color:#66788c;line-height:1.7}.btn{background:var(--main);color:white;border:0;border-radius:40px;padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid #e6ebf0;border-radius:14px;padding:17px 20px;margin:12px 0;font-size:18px;cursor:pointer;color:#203047}.choice.correct{border-color:#12ad78;background:#e3faef}.choice.wrong{border-color:#ee5274;background:#fff0f2}.choice:disabled{cursor:default}.feedback{border-radius:14px;padding:18px;margin:18px 0;background:var(--soft);line-height:1.7}.passage{background:#fafbfe;border-left:4px solid var(--main);padding:20px;border-radius:12px;line-height:2;max-height:400px;overflow:auto;margin:20px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:8px;background:#e9edf2;border-radius:8px;margin:20px 0}.fill{height:100%;background:var(--main);border-radius:8px;transition:width .2s}textarea{width:100%;height:155px;padding:16px;border:2px solid #dfe6ed;border-radius:14px;font:17px system-ui;resize:vertical}a{color:var(--main)}.small{font-size:14px;color:#708094}.hidden{display:none}</style><div class="wrap"><div class="panel"><div id="app"></div></div></div><script>const qs=[{"q": "When did IU discover her love for music?", "opts": ["In elementary school", "In junior high school", "After becoming famous", "In college"], "answer": 1, "why": "The text says IU found her love for music in junior high school."}, {"q": "What did IU decide after singing on stage in seventh grade?", "opts": ["To become a singer", "To become an actor", "To stop performing", "To become a teacher"], "answer": 0, "why": "Her first stage performance led her to decide to become a singer."}, {"q": "How did some relatives react to IU’s dream?", "opts": ["They paid for her lessons", "They encouraged her", "They made fun of her dream", "They joined her band"], "answer": 2, "why": "Her relatives did not believe in her and made fun of her dream."}, {"q": "About how many auditions did IU attend before being signed?", "opts": ["Two", "Ten", "Twenty", "Fifty"], "answer": 2, "why": "The passage says she went to about twenty auditions."}, {"q": "In what year did a company sign IU?", "opts": ["2007", "2010", "2013", "2020"], "answer": 0, "why": "She was signed in 2007."}, {"q": "Which song brought IU her first success three years later?", "opts": ["Dream Job", "Good Day", "Dreamcatcher", "School Club"], "answer": 1, "why": "The text names “Good Day” as her first successful song."}, {"q": "Besides singing, what other work does IU do?", "opts": ["Teaches science", "Designs video games", "Writes songs and acts", "Works as a lawyer"], "answer": 2, "why": "The text says she also writes songs and acts."}, {"q": "What best explains why the writer calls IU a good example for young people?", "opts": ["She became famous immediately", "She never faced rejection", "She kept trying and helps people in need", "She stopped performing"], "answer": 2, "why": "The text emphasizes her persistence and her generosity."}, {"q": "IU faced rejection many times before her first success. Do you think persistence alone is enough to reach a dream? Explain your opinion.", "title": "Critical Thinking｜成功不只靠天分", "hint": "Consider practice, opportunities, help from others, and changing plans.", "starter": "I believe persistence is ... because ..."}, {"q": "Think of a time when something was difficult at school or in your life. What did you do, and what will you try next time?", "title": "Personal Connection｜面對挫折", "hint": "You can write about a test, a performance, a sport, or a friendship.", "starter": "When I struggled with ..., I ... Next time, I will ..."}];const passage="IU is a successful Korean singer. She has fans all over the world. This is her success story.<br><br>IU found her love for music in junior high school. In the seventh grade, she sang on stage for the first time and decided to become a singer. Her relatives didn’t believe in her and made fun of her dream. However, IU didn’t give up.<br><br>IU went to about twenty auditions before a company finally signed her in 2007. Three years later, IU had her first success with her song “Good Day.” After that, many people started listening to her music.<br><br>Now, besides singing, IU also writes songs and acts. Her work is very popular. And that’s not all. She often gives her money to those in need. She is a good example for young people.";const title="IU's Story: Keep Going";const kind="dialogue";let i=-1,score=0,answered=false,chosen={},written={};const app=document.getElementById('app');function render(){if(i===-1){app.innerHTML=`<span class="tag">UNIT 4 · ${kind.toUpperCase()} · PIRLS</span><h1 class="title">${title}</h1><p class="sub">八年級互動式閱讀挑戰｜8 題選擇題 + 2 題生活思辨題<br>選擇答案後立即顯示解析；最後兩題可用英文自由作答。</p><details><summary>先閱讀課文 Read the text</summary><div class="passage">${passage}</div></details><p><button class="btn" onclick="i=0;render()">開始挑戰 Start Quiz →</button></p><p class="small"><a href="../../">← 返回課程首頁</a></p>`;return}if(i===10){app.innerHTML=`<span class="tag">Challenge Complete</span><h1 class="title">完成挑戰！</h1><h2>選擇題得分：${score} / 8</h2><p class="sub">開放題沒有唯一正確答案，請檢查你的理由是否清楚、具體。</p><button class="btn" onclick="i=-1;score=0;chosen={};written={};render()">再練習一次</button> <p><a href="../../">返回首頁</a></p>`;return}let q=qs[i];answered=chosen[i]!==undefined;app.innerHTML=`<div class="top"><span class="tag">${i<2?'Literal':i<4?'Inference':i<6?'Integration':i<8?'Evaluation':i===8?'Critical Thinking':'Personal Connection'}</span><span class="small">Question ${i+1} / 10</span></div><div class="progress"><div class="fill" style="width:${(i+1)*10}%"></div></div><h2>${q.title||q.q}</h2>${q.title?`<p>${q.q}</p><p class="sub">💡 ${q.hint}</p><textarea id="writing" placeholder="Type your thoughts in English...">${written[i]||''}</textarea><p class="small">Sentence starter: ${q.starter}</p>`:q.opts.map((o,n)=>`<button class="choice ${answered?(n===q.answer?'correct':n===chosen[i]?'wrong':''):''}" ${answered?'disabled':''} onclick="choose(${n})">${'ABCD'[n]}) ${o} ${answered&&n===q.answer?'✓':''}</button>`).join('')}${answered?`<div class="feedback"><b>${chosen[i]===q.answer?'答對了！ Great job!':'再想一想！ Keep learning!'}</b><br>${q.why}</div>`:''}<details><summary>查看課文 / Review the text</summary><div class="passage">${passage}</div></details><p><button class="btn" id="next" ${!q.title&&!answered?'disabled':''} onclick="next()">${i===9?'完成 Finish':'下一題 Next →'}</button></p>`}function choose(n){if(chosen[i]!==undefined)return;chosen[i]=n;if(n===qs[i].answer)score++;render()}function next(){if(qs[i].title)written[i]=document.getElementById('writing').value;i++;render()}render();</script></html>
