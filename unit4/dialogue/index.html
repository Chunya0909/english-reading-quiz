<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 4 dialogue</title><style>:root{--main:#078879;--soft:#e6faf3}*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f6f8fb;color:#203047;margin:0}.wrap{max-width:850px;margin:35px auto;padding:0 16px}.panel{background:white;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 35px #24364b12}.tag{display:inline-block;color:var(--main);background:var(--soft);border-radius:30px;padding:7px 15px;font-weight:700}.title{font-size:clamp(28px,5vw,40px);color:var(--main);margin:18px 0}.sub{color:#66788c;line-height:1.7}.btn{background:var(--main);color:white;border:0;border-radius:40px;padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid #e6ebf0;border-radius:14px;padding:17px 20px;margin:12px 0;font-size:18px;cursor:pointer;color:#203047}.choice.correct{border-color:#12ad78;background:#e3faef}.choice.wrong{border-color:#ee5274;background:#fff0f2}.choice:disabled{cursor:default}.feedback{border-radius:14px;padding:18px;margin:18px 0;background:var(--soft);line-height:1.7}.passage{background:#fafbfe;border-left:4px solid var(--main);padding:20px;border-radius:12px;line-height:2;max-height:400px;overflow:auto;margin:20px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:8px;background:#e9edf2;border-radius:8px;margin:20px 0}.fill{height:100%;background:var(--main);border-radius:8px;transition:width .2s}textarea{width:100%;height:155px;padding:16px;border:2px solid #dfe6ed;border-radius:14px;font:17px system-ui;resize:vertical}a{color:var(--main)}.small{font-size:14px;color:#708094}.hidden{display:none}</style><div class="wrap"><div class="panel"><div id="app"></div></div></div><script>const qs=[{"q": "What was Zac making for his YouTube channel?", "opts": ["A song", "A video", "A school poster", "A game"], "answer": 1, "why": "Zac says he is making a video for his YouTube channel."}, {"q": "What does Zac hope to become one day?", "opts": ["A lawyer", "A teacher", "A singer", "A famous YouTuber"], "answer": 3, "why": "He hopes to be a famous YouTuber one day."}, {"q": "What is Cody’s dream job?", "opts": ["A lawyer", "A singer", "A doctor", "A video editor"], "answer": 0, "why": "Cody says, “I plan to be a lawyer.”"}, {"q": "Why does Cody want that job?", "opts": ["To travel the world", "To help people and fight for their rights", "To become famous", "To make videos"], "answer": 1, "why": "Cody wants to help people in need and fight for their rights."}, {"q": "What is Yuki’s dream job?", "opts": ["A lawyer", "A YouTuber", "A singer", "A swimmer"], "answer": 2, "why": "Yuki says being a singer is her dream job."}, {"q": "What makes Yuki nervous?", "opts": ["Singing in front of people", "Making videos alone", "Talking to Cody", "Learning new songs"], "answer": 0, "why": "Yuki gets butterflies in her stomach when people watch her sing."}, {"q": "What does Zac suggest to Yuki?", "opts": ["Stop singing", "Keep practicing", "Change her dream", "Never perform"], "answer": 1, "why": "Zac tells her not to worry and to keep practicing."}, {"q": "What does “get butterflies in my stomach” mean in this conversation?", "opts": ["Feel hungry", "Feel sleepy", "Feel nervous", "Feel angry"], "answer": 2, "why": "Yuki uses the idiom to describe stage fright or nervousness."}, {"q": "Yuki wants to sing but feels nervous in front of people. Is Cody’s wig idea a real solution? What would help Yuki more, and why?", "title": "Critical Thinking｜追求夢想與克服恐懼", "hint": "Think about practice, confidence, and support from friends.", "starter": "I think Yuki could ... because ..."}, {"q": "What job would you like to try in the future? What is one skill you can start developing this year?", "title": "Personal Connection｜我的未來志向", "hint": "Connect your dream to one realistic action in eighth grade.", "starter": "I would like to be ... To prepare, I can ..."}];const passage="Cody: What are you doing, Zac?<br>Zac: I’m making a video for my YouTube channel.<br>Yuki: How cool!<br>Zac: I enjoy making videos, and I hope to be a famous YouTuber one day.<br>Yuki: And you, Cody? What do you want to be in the future?<br>Cody: I plan to be a lawyer. I want to help people in need and fight for their rights.<br>Yuki: Good for you.<br>Cody: What’s your dream job, Yuki?<br>Yuki: Being a singer is my dream job.<br>Zac: It’s great to have a dream. And you’re really good at singing.<br>Yuki: But I hate singing in front of people. I get butterflies in my stomach when people watch me.<br>Zac: Don’t worry. Just keep practicing.<br>Cody: Or you can put on a big wig, and then you can’t see people.<br>Yuki: Haha. Good idea.";const title="Dream Jobs & Stage Fright";const kind="dialogue";let i=-1,score=0,answered=false,chosen={},written={};const app=document.getElementById('app');function render(){if(i===-1){app.innerHTML=`<span class="tag">UNIT 4 · ${kind.toUpperCase()} · PIRLS</span><h1 class="title">${title}</h1><p class="sub">八年級互動式閱讀挑戰｜8 題選擇題 + 2 題生活思辨題<br>選擇答案後立即顯示解析；最後兩題可用英文自由作答。</p><details><summary>先閱讀課文 Read the text</summary><div class="passage">${passage}</div></details><p><button class="btn" onclick="i=0;render()">開始挑戰 Start Quiz →</button></p><p class="small"><a href="../../">← 返回課程首頁</a></p>`;return}if(i===10){app.innerHTML=`<span class="tag">Challenge Complete</span><h1 class="title">完成挑戰！</h1><h2>選擇題得分：${score} / 8</h2><p class="sub">開放題沒有唯一正確答案，請檢查你的理由是否清楚、具體。</p><button class="btn" onclick="i=-1;score=0;chosen={};written={};render()">再練習一次</button> <p><a href="../../">返回首頁</a></p>`;return}let q=qs[i];answered=chosen[i]!==undefined;app.innerHTML=`<div class="top"><span class="tag">${i<2?'Literal':i<4?'Inference':i<6?'Integration':i<8?'Evaluation':i===8?'Critical Thinking':'Personal Connection'}</span><span class="small">Question ${i+1} / 10</span></div><div class="progress"><div class="fill" style="width:${(i+1)*10}%"></div></div><h2>${q.title||q.q}</h2>${q.title?`<p>${q.q}</p><p class="sub">💡 ${q.hint}</p><textarea id="writing" placeholder="Type your thoughts in English...">${written[i]||''}</textarea><p class="small">Sentence starter: ${q.starter}</p>`:q.opts.map((o,n)=>`<button class="choice ${answered?(n===q.answer?'correct':n===chosen[i]?'wrong':''):''}" ${answered?'disabled':''} onclick="choose(${n})">${'ABCD'[n]}) ${o} ${answered&&n===q.answer?'✓':''}</button>`).join('')}${answered?`<div class="feedback"><b>${chosen[i]===q.answer?'答對了！ Great job!':'再想一想！ Keep learning!'}</b><br>${q.why}</div>`:''}<details><summary>查看課文 / Review the text</summary><div class="passage">${passage}</div></details><p><button class="btn" id="next" ${!q.title&&!answered?'disabled':''} onclick="next()">${i===9?'完成 Finish':'下一題 Next →'}</button></p>`}function choose(n){if(chosen[i]!==undefined)return;chosen[i]=n;if(n===qs[i].answer)score++;render()}function next(){if(qs[i].title)written[i]=document.getElementById('writing').value;i++;render()}render();</script></html>
