<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 3 reading</title><style>:root{--main:#7050a3;--soft:#f3edff}*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f6f8fb;color:#203047;margin:0}.wrap{max-width:850px;margin:35px auto;padding:0 16px}.panel{background:white;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 35px #24364b12}.tag{display:inline-block;color:var(--main);background:var(--soft);border-radius:30px;padding:7px 15px;font-weight:700}.title{font-size:clamp(28px,5vw,40px);color:var(--main);margin:18px 0}.sub{color:#66788c;line-height:1.7}.btn{background:var(--main);color:white;border:0;border-radius:40px;padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid #e6ebf0;border-radius:14px;padding:17px 20px;margin:12px 0;font-size:18px;cursor:pointer;color:#203047}.choice.correct{border-color:#12ad78;background:#e3faef}.choice.wrong{border-color:#ee5274;background:#fff0f2}.choice:disabled{cursor:default}.feedback{border-radius:14px;padding:18px;margin:18px 0;background:var(--soft);line-height:1.7}.passage{background:#fafbfe;border-left:4px solid var(--main);padding:20px;border-radius:12px;line-height:2;max-height:400px;overflow:auto;margin:20px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:8px;background:#e9edf2;border-radius:8px;margin:20px 0}.fill{height:100%;background:var(--main);border-radius:8px;transition:width .2s}textarea{width:100%;height:155px;padding:16px;border:2px solid #dfe6ed;border-radius:14px;font:17px system-ui;resize:vertical}a{color:var(--main)}.small{font-size:14px;color:#708094}.hidden{display:none}</style><div class="wrap"><div class="panel"><div id="app"></div></div></div><script>const qs=[{"q": "How often did Emma have bad dreams?", "opts": ["Once a year", "Almost every night", "Only on weekends", "Every afternoon"], "answer": 1, "why": "The story says Emma had bad dreams almost every night."}, {"q": "What happened in one of Emma’s dreams?", "opts": ["She lost her shoes", "She met Dakota", "Her teeth fell out", "She missed a train"], "answer": 2, "why": "In one dream, her teeth fell out one by one."}, {"q": "Why was Emma tired all the time?", "opts": ["She could not get enough sleep", "She played games all night", "She worked after school", "She woke up very early"], "answer": 0, "why": "Her bad dreams kept her from getting enough sleep."}, {"q": "What did Emma’s parents think?", "opts": ["She disliked Dakota", "She needed a new bed", "She was nervous about her new school", "She should move again"], "answer": 2, "why": "Her parents thought she was nervous about her new school."}, {"q": "Who gave Emma the dreamcatcher?", "opts": ["Her mother", "Dakota", "Her teacher", "Her brother"], "answer": 1, "why": "Her friend Dakota gave her a dreamcatcher."}, {"q": "According to Dakota, what goes through the holes?", "opts": ["Bad dreams", "Good dreams", "All dreams", "No dreams"], "answer": 1, "why": "Dakota said good dreams go through the holes."}, {"q": "What changed after Emma hung up the dreamcatcher?", "opts": ["She moved away", "She stopped seeing Dakota", "She could sleep through the night", "She began having more dreams"], "answer": 2, "why": "The story says she could finally sleep through the night."}, {"q": "Which statement best describes the story?", "opts": ["It describes a friend helping Emma", "It teaches how to make a dreamcatcher", "It compares different schools", "It explains how to stop all dreams"], "answer": 0, "why": "The main story follows Emma’s problem and Dakota’s help."}, {"q": "Emma slept better after hanging up the dreamcatcher. Does this prove that it can stop bad dreams? Why or why not?", "title": "Critical Thinking｜觀點與證據", "hint": "Think about the difference between what happened and why it happened.", "starter": "It does / does not prove this because ..."}, {"q": "When you feel nervous or cannot sleep before a big event, what helps you feel better?", "title": "Personal Connection｜生活連結", "hint": "Connect Emma’s experience with school, exams, or new environments.", "starter": "When I feel nervous about ..., I usually ..."}];const passage="After Emma moved to a new city, she had bad dreams almost every night. In one dream, she was eating cake when her teeth fell out one by one. In another, a bear was running after her. These dreams always woke her up. After that, she couldn’t fall asleep again because she was scared. She couldn’t get enough sleep and was tired all the time.<br><br>Emma told her family and friends about her problem. “You’re just nervous about your new school,” her parents said and gave her some tips. However, nothing worked.<br><br>One day, her friend Dakota gave her a dreamcatcher. “Hang this by your bed. The web catches the bad dreams, but the good ones go through the holes,” he told her. Emma hung it up, and it worked! Finally, she could sleep through the night. The dreamcatcher saved her from terrible nights.";const title="The Dreamcatcher";const kind="reading";let i=-1,score=0,answered=false,chosen={},written={};const app=document.getElementById('app');function render(){if(i===-1){app.innerHTML=`<span class="tag">UNIT 3 · ${kind.toUpperCase()} · PIRLS</span><h1 class="title">${title}</h1><p class="sub">八年級互動式閱讀挑戰｜8 題選擇題 + 2 題生活思辨題<br>選擇答案後立即顯示解析；最後兩題可用英文自由作答。</p><details><summary>先閱讀課文 Read the text</summary><div class="passage">${passage}</div></details><p><button class="btn" onclick="i=0;render()">開始挑戰 Start Quiz →</button></p><p class="small"><a href="../../">← 返回課程首頁</a></p>`;return}if(i===10){app.innerHTML=`<span class="tag">Challenge Complete</span><h1 class="title">完成挑戰！</h1><h2>選擇題得分：${score} / 8</h2><p class="sub">開放題沒有唯一正確答案，請檢查你的理由是否清楚、具體。</p><button class="btn" onclick="i=-1;score=0;chosen={};written={};render()">再練習一次</button> <p><a href="../../">返回首頁</a></p>`;return}let q=qs[i];answered=chosen[i]!==undefined;app.innerHTML=`<div class="top"><span class="tag">${i<2?'Literal':i<4?'Inference':i<6?'Integration':i<8?'Evaluation':i===8?'Critical Thinking':'Personal Connection'}</span><span class="small">Question ${i+1} / 10</span></div><div class="progress"><div class="fill" style="width:${(i+1)*10}%"></div></div><h2>${q.title||q.q}</h2>${q.title?`<p>${q.q}</p><p class="sub">💡 ${q.hint}</p><textarea id="writing" placeholder="Type your thoughts in English...">${written[i]||''}</textarea><p class="small">Sentence starter: ${q.starter}</p>`:q.opts.map((o,n)=>`<button class="choice ${answered?(n===q.answer?'correct':n===chosen[i]?'wrong':''):''}" ${answered?'disabled':''} onclick="choose(${n})">${'ABCD'[n]}) ${o} ${answered&&n===q.answer?'✓':''}</button>`).join('')}${answered?`<div class="feedback"><b>${chosen[i]===q.answer?'答對了！ Great job!':'再想一想！ Keep learning!'}</b><br>${q.why}</div>`:''}<details><summary>查看課文 / Review the text</summary><div class="passage">${passage}</div></details><p><button class="btn" id="next" ${!q.title&&!answered?'disabled':''} onclick="next()">${i===9?'完成 Finish':'下一題 Next →'}</button></p>`}function choose(n){if(chosen[i]!==undefined)return;chosen[i]=n;if(n===qs[i].answer)score++;render()}function next(){if(qs[i].title)written[i]=document.getElementById('writing').value;i++;render()}render();</script></html>
