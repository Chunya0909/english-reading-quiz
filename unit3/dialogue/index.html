<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 3 dialogue</title><style>:root{--main:#007f77;--soft:#e4f7f3}*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f6f8fb;color:#203047;margin:0}.wrap{max-width:850px;margin:35px auto;padding:0 16px}.panel{background:white;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 35px #24364b12}.tag{display:inline-block;color:var(--main);background:var(--soft);border-radius:30px;padding:7px 15px;font-weight:700}.title{font-size:clamp(28px,5vw,40px);color:var(--main);margin:18px 0}.sub{color:#66788c;line-height:1.7}.btn{background:var(--main);color:white;border:0;border-radius:40px;padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid #e6ebf0;border-radius:14px;padding:17px 20px;margin:12px 0;font-size:18px;cursor:pointer;color:#203047}.choice.correct{border-color:#12ad78;background:#e3faef}.choice.wrong{border-color:#ee5274;background:#fff0f2}.choice:disabled{cursor:default}.feedback{border-radius:14px;padding:18px;margin:18px 0;background:var(--soft);line-height:1.7}.passage{background:#fafbfe;border-left:4px solid var(--main);padding:20px;border-radius:12px;line-height:2;max-height:400px;overflow:auto;margin:20px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:8px;background:#e9edf2;border-radius:8px;margin:20px 0}.fill{height:100%;background:var(--main);border-radius:8px;transition:width .2s}textarea{width:100%;height:155px;padding:16px;border:2px solid #dfe6ed;border-radius:14px;font:17px system-ui;resize:vertical}a{color:var(--main)}.small{font-size:14px;color:#708094}.hidden{display:none}</style><div class="wrap"><div class="panel"><div id="app"></div></div></div><script>const qs=[{"q": "Who first thought Lucky broke the cup?", "opts": ["Kim", "Jamie", "Mom", "Lucky"], "answer": 1, "why": "Jamie said, “Maybe Lucky did it.”"}, {"q": "What was Mom doing at 12:30?", "opts": ["Sleeping", "Washing dishes", "Drinking water", "Watching TV"], "answer": 1, "why": "Mom was doing the dishes at half past twelve."}, {"q": "What did Kim and Jamie check?", "opts": ["A photo", "A diary", "A dog-monitor video", "A phone message"], "answer": 2, "why": "They checked the video from the dog monitor."}, {"q": "Why did Jamie say Mom did not break it?", "opts": ["Mom was outside", "The cup was fine when Mom left", "Lucky was sleeping", "Kim had cleaned it"], "answer": 1, "why": "Jamie pointed out that the cup was fine when Mom left."}, {"q": "What was Jamie doing at 1:15?", "opts": ["Drinking water", "Doing dishes", "Making breakfast", "Watching Lucky"], "answer": 0, "why": "Jamie said she was drinking water at a quarter after one."}, {"q": "What did the video show at 2 a.m.?", "opts": ["Lucky was running", "Mom was cooking", "Jamie was cleaning", "Kim was in the kitchen"], "answer": 3, "why": "Jamie told Kim she was in the kitchen at 2 a.m."}, {"q": "Why did Kim not remember breaking the cup?", "opts": ["She was sleepwalking", "She was too busy", "She was at school", "She was watching TV"], "answer": 0, "why": "Kim realized she had been sleepwalking."}, {"q": "What is the best lesson from this dialogue?", "opts": ["Blame someone quickly", "Check evidence before blaming", "Never watch videos", "Keep cups outside"], "answer": 1, "why": "The characters wrongly suspected others before checking all the evidence."}, {"q": "Kim blamed Mom before checking everything. Why is it important to look at all the evidence before blaming someone?", "title": "Critical Thinking｜證據與判斷", "hint": "Think about misunderstandings in your class or at home.", "starter": "We should check the facts before blaming someone because ..."}, {"q": "Have you ever misunderstood a friend or family member? What happened, and how did you solve the problem?", "title": "Personal Connection｜生活連結", "hint": "Describe a real situation and what you learned.", "starter": "Once, I thought ... Later, I found out ..."}];const passage="<b>Kim:</b> Someone broke my favorite cup.<br><b>Jamie:</b> Maybe Lucky did it.<br><b>Kim:</b> Let’s check the video from the dog monitor.<br><b>Jamie:</b> Stop! Mom was doing the dishes at half past twelve.<br><b>Kim:</b> It was her. I knew it.<br><b>Jamie:</b> Take it easy, Kim. Look. The cup was fine when she left.<br><b>Kim:</b> All right.<br><br><i>(Five minutes later)</i><br><b>Kim:</b> Hey, what were you doing in the kitchen at a quarter after one? It was you.<br><b>Jamie:</b> Cool down. I was drinking water, and I wasn’t even close to the table. See?<br><b>Kim:</b> Then who broke my cup?<br><b>Jamie:</b> Er, look. You did. You were in the kitchen at 2 a.m.<br><b>Kim:</b> I was in the kitchen? I don’t remember that at all.<br><b>Jamie:</b> Your eyes weren’t open. What were you doing?<br><b>Kim:</b> Oh no! I was sleepwalking when I broke my cup.";const title="The Broken Cup Mystery";const kind="dialogue";let i=-1,score=0,answered=false,chosen={},written={};const app=document.getElementById('app');function render(){if(i===-1){app.innerHTML=`<span class="tag">UNIT 3 · ${kind.toUpperCase()} · PIRLS</span><h1 class="title">${title}</h1><p class="sub">八年級互動式閱讀挑戰｜8 題選擇題 + 2 題生活思辨題<br>選擇答案後立即顯示解析；最後兩題可用英文自由作答。</p><details><summary>先閱讀課文 Read the text</summary><div class="passage">${passage}</div></details><p><button class="btn" onclick="i=0;render()">開始挑戰 Start Quiz →</button></p><p class="small"><a href="../../">← 返回課程首頁</a></p>`;return}if(i===10){app.innerHTML=`<span class="tag">Challenge Complete</span><h1 class="title">完成挑戰！</h1><h2>選擇題得分：${score} / 8</h2><p class="sub">開放題沒有唯一正確答案，請檢查你的理由是否清楚、具體。</p><button class="btn" onclick="i=-1;score=0;chosen={};written={};render()">再練習一次</button> <p><a href="../../">返回首頁</a></p>`;return}let q=qs[i];answered=chosen[i]!==undefined;app.innerHTML=`<div class="top"><span class="tag">${i<2?'Literal':i<4?'Inference':i<6?'Integration':i<8?'Evaluation':i===8?'Critical Thinking':'Personal Connection'}</span><span class="small">Question ${i+1} / 10</span></div><div class="progress"><div class="fill" style="width:${(i+1)*10}%"></div></div><h2>${q.title||q.q}</h2>${q.title?`<p>${q.q}</p><p class="sub">💡 ${q.hint}</p><textarea id="writing" placeholder="Type your thoughts in English...">${written[i]||''}</textarea><p class="small">Sentence starter: ${q.starter}</p>`:q.opts.map((o,n)=>`<button class="choice ${answered?(n===q.answer?'correct':n===chosen[i]?'wrong':''):''}" ${answered?'disabled':''} onclick="choose(${n})">${'ABCD'[n]}) ${o} ${answered&&n===q.answer?'✓':''}</button>`).join('')}${answered?`<div class="feedback"><b>${chosen[i]===q.answer?'答對了！ Great job!':'再想一想！ Keep learning!'}</b><br>${q.why}</div>`:''}<details><summary>查看課文 / Review the text</summary><div class="passage">${passage}</div></details><p><button class="btn" id="next" ${!q.title&&!answered?'disabled':''} onclick="next()">${i===9?'完成 Finish':'下一題 Next →'}</button></p>`}function choose(n){if(chosen[i]!==undefined)return;chosen[i]=n;if(n===qs[i].answer)score++;render()}function next(){if(qs[i].title)written[i]=document.getElementById('writing').value;i++;render()}render();</script></html>
