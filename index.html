<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八年級英文互動閱讀學習網｜Unit 1–6</title><style>:root{--ink:#1f3148;--muted:#718198}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:linear-gradient(#fff8fa,#f5f8fc 330px)}.wrap{max-width:1320px;margin:auto;padding:44px 22px 70px}.hero{text-align:center;margin-bottom:42px}.eyebrow{font-weight:800;letter-spacing:.12em;color:#c15a76}.hero h1{font-size:clamp(30px,5vw,48px);color:#a31940;margin:12px 0}.hero p{color:var(--muted);line-height:1.9;font-size:18px}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.legend span{padding:9px 17px;border-radius:40px;font-weight:700}.legend .d{background:#ffedf2;color:#c72850}.legend .r{background:#eaf5ff;color:#2470a9}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px}.unit{background:white;border:1px solid #e1e7f0;border-radius:25px;padding:28px;box-shadow:0 14px 28px #1d345010}.unit-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.unit-label{font-weight:800;letter-spacing:.08em;color:#899aaf}.unit h2{font-size:27px;margin:8px 0 0}.status{font-size:12px;font-weight:800;background:#eaf8f3;color:#08795c;border-radius:24px;padding:8px 12px;max-width:130px}.entry{display:block;text-decoration:none;padding:20px 22px;border-radius:19px;margin-top:14px;border:1px solid;transition:transform .15s}.entry:hover,.entry:focus-visible{transform:translateY(-3px);outline-offset:3px}.entry b{display:block;font-size:21px;margin-bottom:9px}.entry span{font-size:15px;line-height:1.75}.dialogue{background:#fff0f4;color:#c51c48;border-color:#ffd1df}.reading{background:#eaf5ff;color:#226fa9;border-color:#cce6ff}.unit:nth-child(3) .dialogue{background:#fff1e5;color:#9c591f;border-color:#ffe0c1}.unit:nth-child(3) .reading{background:#f0eefe;color:#6951aa;border-color:#ddd5ff}.unit:nth-child(4) .dialogue{background:#fff1f9;color:#aa367d;border-color:#f8d2eb}.unit:nth-child(4) .reading{background:#f1efff;color:#6351a8;border-color:#ddd6fa}.unit:nth-child(5) .dialogue{background:#fff0f7;color:#b5487d;border-color:#ffd6e7}.unit:nth-child(5) .reading{background:#e8f7fc;color:#287e99;border-color:#c9eaf3}.unit:nth-child(6) .dialogue{background:#fff0f0;color:#bd344e;border-color:#ffd4d8}.unit:nth-child(6) .reading{background:#eaf7ed;color:#26785a;border-color:#c9e9d4}.footer{text-align:center;color:#9ba7b5;font-size:13px;margin-top:38px}</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">GRADE 8 · PIRLS READING CHALLENGE</div><h1>八年級英文互動閱讀學習網</h1><p>每一課包含 Dialogue 對話教材與 Reading 閱讀教材。<br>練習直接提取、推論、整合、批判思考與生活連結。</p><div class="legend"><span class="d">▤ Dialogue 對話教材</span><span class="r">▣ Reading 閱讀教材</span></div></header><main class="units" id="units"></main><footer class="footer">English Reading Quiz · Grade 8 · CEFR × PIRLS</footer></div><script>const units=[['Summer Vacation','Jamie & Zac｜暑假旅行、天氣、家人支持','Australian English｜澳洲明信片、語言與文化'],['School Clubs','Choosing a School Club｜社團選擇、興趣、改變與成長','Video Game Design Club｜招生廣告、資訊判讀與宣傳策略'],['The Mystery of the Broken Cup','The Broken Cup｜事件線索、時間與推理','The Dreamcatcher｜夢境、情緒與友誼'],['Dream Jobs','Dream Jobs｜未來志向、夢想與克服緊張','IU’s Story｜努力、挫折與堅持'],['London Adventures','Getting Around London｜交通、問路與英國文化','A Fun Day in London｜旅遊行程、時間順序與文化體驗'],['Shopping and Fashion','Christmas Shopping｜價格、折扣、禮物與家人','The Ugly Truth Behind Beautiful Clothes｜快時尚、勞工與環境']];document.getElementById('units').innerHTML=units.map((u,i)=>`<section class="unit"><div class="unit-top"><div><div class="unit-label">UNIT ${i+1}</div><h2>${u[0]}</h2></div><div class="status">Dialogue &amp; Reading 已完成</div></div><a class="entry dialogue" href="unit${i+1}/dialogue/"><b>▤ Dialogue Challenge</b><span>${u[1]}｜互動式 PIRLS 閱讀挑戰</span></a><a class="entry reading" href="unit${i+1}/reading/"><b>▣ Reading Challenge</b><span>${u[2]}｜互動式 PIRLS 閱讀挑戰</span></a></section>`).join('');</script></body></html>
