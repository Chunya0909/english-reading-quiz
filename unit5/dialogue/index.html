<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 5 | Getting Around London</title><style>:root{--a:#b5487d;--light:#fff0f6}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#233047;font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:850px;margin:32px auto;padding:20px}.panel{background:white;border:1px solid #e1e6ee;border-radius:25px;padding:clamp(20px,5vw,46px);box-shadow:0 12px 30px #2233440c}.tag{color:var(--a);font-weight:700;letter-spacing:2px}.title{font-size:clamp(28px,5vw,42px);margin:12px 0}p{line-height:1.7}.muted{color:#687891}.top{display:flex;justify-content:space-between;gap:12px}.progress{height:9px;background:#edf0f5;border-radius:20px;overflow:hidden;margin:24px 0}.bar{height:100%;background:var(--a);transition:width .2s}.option{display:block;width:100%;text-align:left;border:2px solid #e8ebf0;background:white;border-radius:15px;padding:17px 20px;margin:12px 0;font-size:17px;cursor:pointer;color:#243047}.option:hover:not(:disabled){border-color:var(--a);background:var(--light)}.option.correct{border-color:#00ae80;background:#e7fbf3}.option.wrong{border-color:#f04f68;background:#fff0f3}.option:disabled{cursor:default}.feedback{margin-top:18px;border-radius:15px;padding:18px;background:var(--light);line-height:1.7}button.action{background:var(--a);color:white;border:0;border-radius:40px;padding:13px 25px;font-size:17px;font-weight:700;cursor:pointer;margin-top:20px}button.secondary{background:#e9edf4;color:#233047;margin-right:10px}textarea{width:100%;min-height:160px;padding:17px;border:2px solid #e1e6ee;border-radius:14px;font-size:17px;resize:vertical}small{color:#687891}.hidden{display:none}a{color:var(--a)}</style></head><body><main><div class="panel"><div id="welcome"><div class="tag">UNIT 5 · Dialogue · PIRLS CHALLENGE</div><h1 class="title">Getting Around London</h1><p>八年級英文互動閱讀理解｜8 題四選一 + 2 題生活連結反思</p><p class="muted">作答後立即查看提示與課文證據。最後兩題沒有唯一標準答案。</p><button class="action" onclick="start()">開始挑戰 Start Quiz →</button><p><a href="../../index.html">← 返回 Unit 5 首頁</a></p></div><div id="quiz" class="hidden"><div class="top"><span class="tag" id="level"></span><span class="muted" id="count"></span></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="action hidden" onclick="advance()">下一題 Next →</button></div><div id="done" class="hidden"><div class="tag">CHALLENGE COMPLETE</div><h1>完成挑戰！</h1><h2 id="score"></h2><p>閱讀理解不只尋找答案，也要思考如何運用在自己的生活中。</p><button class="action" onclick="location.reload()">再挑戰一次</button><p><a href="../../index.html">← 返回 Unit 5 首頁</a></p></div></div></main><script>const questions=[{"q": "Where are the Katos at the beginning?", "opts": ["At a hotel", "At an airport", "At a park", "At a station"], "ans": 1, "evidence": "The Katos are at an airport in London.", "level": "直接提取"}, {"q": "Which station is near their hotel?", "opts": ["Hyde Park", "Piccadilly", "Green Park", "Stratton Street"], "ans": 2, "evidence": "Their hotel is near Green Park Station.", "level": "直接提取"}, {"q": "Why does Mom want to ask someone for help?", "opts": ["They lost their tickets.", "They cannot find their way.", "They missed their train.", "They forgot the hotel name."], "ans": 1, "evidence": "They are lost and do not have a map.", "level": "直接推論"}, {"q": "Why is Dad confused at the hotel?", "opts": ["The clerk speaks too fast.", "The room number is wrong.", "The hotel has no stairs.", "The UK counts floors differently."], "ans": 3, "evidence": "The clerk says they are on the ground floor, not the first floor.", "level": "直接推論"}, {"q": "Which directions match the man’s advice?", "opts": ["Go straight, turn left on Berkeley Street, then turn left at Stratton Street.", "Go straight, turn right on Berkeley Street, then turn left at Stratton Street.", "Go straight, turn left on Berkeley Street, then turn right at Stratton Street.", "Go straight, turn left on Stratton Street, then turn left at Berkeley Street."], "ans": 0, "evidence": "Go straight and turn left on Berkeley Street. Then turn left at the corner of Stratton Street and Berkeley Street.", "level": "整合詮釋"}, {"q": "What can we learn about Yuki’s family?", "opts": ["They prefer to travel without plans.", "They ask for help when they need it.", "They avoid using public transportation.", "They already know London very well."], "ans": 1, "evidence": "They use the Tube, ask a man for directions, and check with the hotel clerk.", "level": "整合詮釋"}, {"q": "Why is “Getting Around London” a suitable title?", "opts": ["It tells how the family travels and finds places.", "It explains how the family buys train tickets.", "It lists all the hotels in London.", "It describes only the rooms in a hotel."], "ans": 0, "evidence": "The dialogue includes the Tube, directions, and finding the hotel.", "level": "整合詮釋"}, {"q": "Which detail best shows a cultural difference?", "opts": ["The family arrives at an airport.", "Yuki wants to go to a park.", "The UK uses “ground floor” differently.", "The hotel is near a station."], "ans": 2, "evidence": "Dad learns that the ground floor and first floor are different in the UK.", "level": "批判評估"}, {"q": "When you get lost in an unfamiliar place, what would you do? Explain two steps you would take.", "hint": "Think about asking for help politely and checking a map.", "level": "生活連結", "open": true}, {"q": "Have you ever experienced a cultural difference or misunderstanding? How did you respond?", "hint": "Think about listening, asking questions, and showing respect.", "level": "生活連結", "open": true}];let n=0,score=0,locked=false;const $=id=>document.getElementById(id);function start(){$('welcome').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){locked=false;let x=questions[n];$('level').textContent=x.level;$('count').textContent=`Question ${n+1} / ${questions.length}`;$('bar').style.width=`${n/questions.length*100}%`;$('question').textContent=x.q;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('answers').innerHTML='';if(x.open){let t=document.createElement('textarea');t.placeholder='請輸入你的想法... Type your thoughts here.';t.value=sessionStorage.getItem('u5-Dialogue-'+n)||'';t.oninput=()=>sessionStorage.setItem('u5-Dialogue-'+n,t.value);$('answers').append(t);$('feedback').textContent='Hint: '+x.hint;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}else{x.opts.forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent='ABCD'[i]+') '+v;b.onclick=()=>choose(i);$('answers').append(b)})}$('next').textContent=n===questions.length-1?'完成 Finish':'下一題 Next →'}function choose(i){if(locked)return;locked=true;let x=questions[n];if(i===x.ans)score++;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===x.ans)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(i===x.ans?'答對了！ ':'再想一想。 ')+ 'Text evidence: '+x.evidence;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}function advance(){if(!questions[n].open&&!locked)return;n++;if(n===questions.length){$('quiz').classList.add('hidden');$('done').classList.remove('hidden');$('score').textContent='選擇題答對 '+score+' / 8 題';return}render()}</script></body></html>
