<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 2 Dialogue｜Choosing a School Club</title>
<style>
:root{
 --bg:#f4f8fb;--card:#ffffff;--text:#18324a;--muted:#758297;
 --primary:#177b8f;--secondary:#6a55c8;--accent:#ffd166;
 --green:#00a878;--red:#e33b54;
 --l1:#fff2e6;--l2:#fff9d9;--l3:#f2ecff;--l4:#e6f7f8;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#e8f7ff 0,var(--bg) 360px);font-family:Georgia,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text)}
.screen{min-height:100vh}
#start{display:grid;place-items:center;padding:50px 20px}
.start-card{width:min(880px,95vw);background:#fff;border:2px solid #cde8ef;border-radius:24px;padding:46px 40px 38px;text-align:center;box-shadow:0 18px 34px rgba(30,50,80,.14)}
.icon{font-size:64px;line-height:1}
h1{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--primary);font-size:35px;margin:20px 0 8px}
.subtitle{font-family:Arial,sans-serif;color:var(--secondary);font-size:20px;letter-spacing:.03em;margin:0 0 22px;font-weight:800}
.intro{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.8;color:#58677d}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0 38px}
.levelbox{padding:19px 8px;border-radius:15px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;border:1px solid rgba(0,0,0,.06)}
.levelbox b{display:block;font-size:18px;margin-bottom:8px}
.l1{background:var(--l1);color:#a74725}.l2{background:var(--l2);color:#786500}.l3{background:var(--l3);color:#5e3c9e}.l4{background:var(--l4);color:#1b6b78}
.startbtn{border:0;color:#fff;font-weight:800;font-size:19px;padding:17px 44px;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--secondary));cursor:pointer}
#quiz{display:none}
.top{height:66px;background:#fff;border-bottom:1px solid #e7ebef;display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}
.top strong{font:20px Arial,sans-serif;color:#2d3542}.progressText{font:16px Arial,sans-serif;color:#8894a6}
.quizwrap{max-width:920px;margin:auto;padding:20px 18px 50px}
.progress{height:8px;background:#e8edf1;border-radius:10px;overflow:hidden;margin:0 0 14px}.bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));width:0;transition:.25s}
.qcard{background:#fff;border:1px solid #dde3e8;border-radius:22px;padding:30px;box-shadow:0 13px 26px rgba(35,56,75,.12)}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.badge{font:14px Arial,sans-serif;padding:7px 15px;border-radius:999px;font-weight:700}
.badge.level1{background:var(--l1);color:#a74725}.badge.level2{background:var(--l2);color:#786500}.badge.level3{background:var(--l3);color:#5e3c9e}.badge.level4{background:var(--l4);color:#1b6b78}
.qcount{font-size:18px;color:#9da7ba}
.question{font-size:27px;line-height:1.45;font-weight:700;margin:0 0 20px}
.zhhelp{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#4a5a6f;font-size:16px;line-height:1.7;margin:-6px 0 22px}
.hint{font-family:Georgia,serif;font-style:italic;color:var(--primary);font-size:18px;line-height:1.45;margin:0 0 20px}
.options{display:grid;gap:14px}
.option{width:100%;text-align:left;background:#fff;border:2px solid #edf0f2;border-radius:16px;padding:20px;font:20px Georgia,"Noto Sans TC",sans-serif;color:#172c48;cursor:pointer;transition:.15s;min-height:72px}
.option:hover:not(:disabled){border-color:#8dd2dc;transform:translateY(-1px)}
.option:disabled{cursor:default;color:#a6b0c0}
.option.wrong{border-color:var(--red);background:#fff1f3;color:#8d1229}
.option.correct{border-color:var(--green);background:#eaf9f4;color:#075c48}
.option .mark{float:right;font-family:Arial;font-weight:bold;font-size:25px}
textarea{width:100%;min-height:175px;border:2px solid #dce3e8;border-radius:16px;padding:18px 20px;font:18px/1.6 Georgia,"Noto Sans TC",sans-serif;color:#203451;resize:vertical;outline:none}
textarea:focus{border-color:#80cbd7;box-shadow:0 0 0 4px #eefbfd}
.starters{margin-top:16px;padding:16px;border-radius:14px;background:#f5f0ff;border:1px solid #ded2ff;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7;color:#5b4a71}
.feedback{display:none;margin-top:28px;padding:20px;border-radius:15px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.7}
.feedback.good{display:block;background:#e8fbf5;border:1px solid #c0f2df;color:#006b54}
.feedback.bad{display:block;background:#fff0f1;border:1px solid #ffd7dc;color:#a41331}
.feedback.info{display:block;background:#edf9fb;border:1px solid #caebef;color:#236674}
.feedback strong{font-size:18px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.next,.submitopen{border:0;background:var(--text);color:white;border-radius:12px;padding:13px 28px;font-weight:800;font-size:16px;cursor:pointer}
.submitopen{background:linear-gradient(90deg,var(--primary),var(--secondary))}
#result{display:none;text-align:center}
.result-card{background:#fff;border-radius:22px;border:1px solid #e0e4e8;padding:45px;box-shadow:0 16px 28px rgba(35,56,75,.12)}
.score{font:800 60px Arial;color:var(--primary)}.result-card h2{font-size:30px}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}.mini{border-radius:14px;padding:15px;font-family:"Noto Sans TC",sans-serif}
.openresponses{text-align:left;margin-top:28px;padding-top:24px;border-top:1px solid #e5e9ee}
.responsebox{background:#fafafa;border:1px solid #e5e9ee;border-radius:14px;padding:16px;margin:12px 0;white-space:pre-wrap;font-family:"Noto Sans TC",sans-serif;line-height:1.7}
.retry{border:0;background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;padding:14px 30px;border-radius:999px;font-size:17px;font-weight:800;cursor:pointer}
@media(max-width:700px){.levels,.breakdown{grid-template-columns:1fr 1fr}.start-card{padding:30px 20px}.question{font-size:22px}.option{font-size:18px}.qcard{padding:22px}.top{padding:0 18px}}
</style>
</head>
<body>
<section id="start" class="screen">
 <div class="start-card">
  <div class="icon">🎯</div>
  <h1>Unit 2 Dialogue｜Choosing a School Club</h1>
  <div class="subtitle">✨ CLUB CHOICE CHALLENGE ✨</div>
  <p class="intro">八年級英語互動挑戰｜從 Cody、Yuki 與 Shin 的對話中，找出興趣、選擇、改變與成長的線索。</p>
  <div class="levels">
   <div class="levelbox l1"><b>Q1–Q2</b>直接提取訊息</div>
   <div class="levelbox l2"><b>Q3–Q4</b>直接推論</div>
   <div class="levelbox l3"><b>Q5–Q7</b>詮釋與整合</div>
   <div class="levelbox l4"><b>Q8–Q10</b>評估 × 思辨 × 生活連結</div>
  </div>
  <button class="startbtn" onclick="startQuiz()">開始挑戰 Start Quiz</button>
 </div>
</section>

<section id="quiz" class="screen">
 <header class="top"><strong>Unit 2 Dialogue｜Choosing a School Club</strong><span class="progressText" id="topCount"></span></header>
 <main class="quizwrap">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div id="questionArea"></div>
  <section id="result">
   <div class="result-card">
    <div>YOUR SCORE</div><div class="score" id="score"></div>
    <h2 id="resultTitle"></h2><p id="resultMsg"></p>
    <div class="breakdown" id="breakdown"></div>
    <div class="openresponses">
      <h3>你的開放式回答 Open-ended Responses</h3>
      <div><strong>Q9</strong><div class="responsebox" id="r9"></div></div>
      <div><strong>Q10</strong><div class="responsebox" id="r10"></div></div>
    </div>
    <button class="retry" onclick="location.reload()">重新挑戰 Try Again</button>
   </div>
  </section>
 </main>
</section>

<script>
const data=[{"type": "mc", "cls": "level1", "badge": "Level 1 · Literal", "q": "Why can't Yuki make up her mind about a school club?", "opts": ["All the clubs are interesting.", "She does not like school clubs.", "She is too busy after school.", "Cody has not called her yet."], "ans": 0, "good": "Yuki says, “I can't make up my mind because all the clubs are interesting.”", "hint": "找 Yuki 說 because 的那一句。"}, {"type": "mc", "cls": "level1", "badge": "Level 1 · Literal", "q": "Which subject is Cody's favorite?", "opts": ["English.", "Computer science.", "P.E.", "Art."], "ans": 1, "good": "Cody says computer science is his favorite subject.", "hint": "注意 Cody 說 video game design club 的原因。"}, {"type": "mc", "cls": "level2", "badge": "Level 2 · Inferential", "q": "Why did Cody think of Yuki when he heard about the video game design club?", "opts": ["Yuki likes computer science too.", "Yuki already joined the club.", "Yuki is good at swimming.", "Yuki owns a video camera."], "ans": 0, "good": "Yuki says she likes computer science too, so Cody thought the club might interest her.", "hint": "把 Yuki 的興趣和 Cody 後面的回答連起來。"}, {"type": "mc", "cls": "level2", "badge": "Level 2 · Inferential", "q": "Why is Cody surprised that Yuki joined the water sports club?", "opts": ["He thinks the club is too expensive.", "He knows Yuki is a poor swimmer.", "He wanted Yuki to join basketball.", "He thinks Shin left the club."], "ans": 1, "good": "Cody says, “You are a poor swimmer,” so he is surprised she chose a water sports club.", "hint": "看 Cody 聽到 water sports club 後立刻說了什麼。"}, {"type": "mc", "cls": "level3", "badge": "Level 3 · Integrative", "q": "What helped Yuki decide to join the water sports club?", "opts": ["Cody asked her to join.", "Shin's experience encouraged her.", "She wanted to use Cody's camera.", "The video game club was full."], "ans": 1, "good": "Yuki says she signed up after Shin told her about it, and Shin had improved from a poor swimmer to swimming very well.", "hint": "結合 Shin 的經驗與 Yuki “signed up” 的原因。"}, {"type": "mc", "cls": "level3", "badge": "Level 3 · Integrative", "q": "How are Cody and Yuki similar?", "opts": ["They both like computer science.", "They both joined the water sports club.", "They both own underwater cameras.", "They both dislike school clubs."], "ans": 0, "good": "Cody says computer science is his favorite subject, and Yuki says she likes it too.", "hint": "比較電話對話中兩人談到 subject 的部分。"}, {"type": "mc", "cls": "level3", "badge": "Level 3 · Integrative", "q": "What can we learn about Yuki from both conversations?", "opts": ["She considers choices before deciding.", "She always follows Cody's advice.", "She only likes indoor activities.", "She changes clubs every year."], "ans": 0, "good": "At first Yuki cannot make up her mind and says she will think about a club. Later, she chooses the water sports club after hearing Shin's experience.", "hint": "把第一段的猶豫和第二段最後的選擇放在一起看。"}, {"type": "mc", "cls": "level4", "badge": "Level 4 · Critical", "q": "What is the main purpose of these dialogues?", "opts": ["To show students thinking about and choosing school clubs.", "To teach students how to become strong swimmers.", "To compare school subjects in two countries.", "To explain how to use an underwater camera."], "ans": 0, "good": "Both dialogues focus on school clubs, interests, choices, and reasons for joining.", "hint": "想想兩段對話共同的主題，而不是單一細節。"}, {"type": "open", "cls": "level4", "badge": "Critical Thinking", "q": "Yuki first liked the video game design club, but later chose the water sports club after hearing Shin's story. What should a student think about before choosing a school club? Explain your answer.", "zh": "Yuki 原本對電玩設計社有興趣，後來聽了 Shin 的經驗後選擇水上運動社。你認為學生選社團前應該考慮哪些事情？為什麼？", "hint": "💡 Hint: Think about interests, skills, goals, friends, and chances to learn something new.", "starter": "Before choosing a club, I think students should consider ______ because ______.", "sample": "Sample idea: Before choosing a club, students should consider their interests and what they want to learn because a good club should be both enjoyable and meaningful."}, {"type": "open", "cls": "level4", "badge": "Personal Connection", "q": "If you could join one school club this semester, which club would you choose and why? What would you hope to learn or improve?", "zh": "如果這學期你可以選一個社團，你會選哪一個？為什麼？你希望學到或進步什麼？", "hint": "💡 Hint: Think about sports, music, technology, art, service, or another interest.", "starter": "I would choose the ______ club because ______. I hope to ______.", "sample": "Sample idea: I would choose the photography club because I like taking pictures. I hope to learn how to take better photos and work with other students."}];
let idx=0,score=0,levelScores=[0,0,0,0],openAnswers={8:"",9:""};

function startQuiz(){document.getElementById("start").style.display="none";document.getElementById("quiz").style.display="block";render()}
function levelIndex(i){return i<2?0:i<4?1:i<7?2:3}
function render(){
 const x=data[idx];
 document.getElementById("topCount").textContent=`Question ${idx+1} / ${data.length}`;
 document.getElementById("bar").style.width=`${idx/data.length*100}%`;
 let body="";
 if(x.type==="mc"){
  body=`<div class="options">${x.opts.map((o,i)=>`<button class="option" onclick="choose(${i},this)">${"ABCD"[i]}) ${o}<span class="mark"></span></button>`).join("")}</div>
        <div class="feedback" id="feedback"></div>
        <div class="actions"><button class="next" id="next" style="display:none" onclick="nextQ()">${idx===data.length-1?"查看結果 See Result":"下一題 Next →"}</button></div>`;
 }else{
  body=`<div class="zhhelp">${x.zh}</div>
        <div class="hint">${x.hint}</div>
        <textarea id="openText" placeholder="請在這裡輸入你的想法... (Type your thoughts here...)">${openAnswers[idx]||""}</textarea>
        <div class="starters"><strong>Sentence starter:</strong><br>${x.starter}</div>
        <div class="feedback info" id="feedback" style="display:none"></div>
        <div class="actions"><button class="submitopen" onclick="submitOpen()">Submit My Idea</button><button class="next" id="next" style="display:none" onclick="nextQ()">${idx===data.length-1?"查看結果 See Result":"下一題 Next →"}</button></div>`;
 }
 document.getElementById("questionArea").innerHTML=`
 <div class="qcard">
  <div class="qmeta"><span class="badge ${x.cls}">${x.badge}</span><span class="qcount">Question ${idx+1} / ${data.length}</span></div>
  <div class="question">${x.q}</div>${body}
 </div>`;
}
function choose(choice,btn){
 const x=data[idx], buttons=[...document.querySelectorAll(".option")], fb=document.getElementById("feedback");
 buttons.forEach(b=>b.disabled=true);
 if(choice===x.ans){
  score++; levelScores[levelIndex(idx)]++;
  btn.classList.add("correct");btn.querySelector(".mark").textContent="✓";
  fb.className="feedback good";fb.innerHTML=`<strong>太棒了，答對了！✨</strong><br>${x.good}`;
 }else{
  btn.classList.add("wrong");btn.querySelector(".mark").textContent="×";
  buttons[x.ans].classList.add("correct");buttons[x.ans].querySelector(".mark").textContent="✓";
  fb.className="feedback bad";fb.innerHTML=`<strong>差一點點，看看提示再想想：</strong><br>${x.hint}<br><span style="opacity:.8">${x.good}</span>`;
 }
 fb.style.display="block";
 document.getElementById("next").style.display="inline-block";
}
function submitOpen(){
 const x=data[idx], text=document.getElementById("openText").value.trim(), fb=document.getElementById("feedback");
 if(!text){fb.className="feedback bad";fb.style.display="block";fb.innerHTML="<strong>請先寫下你的想法。</strong><br>你可以使用上面的 sentence starter 幫助你開始。";return;}
 openAnswers[idx]=text;
 fb.className="feedback info";fb.style.display="block";
 fb.innerHTML=`<strong>已收到你的想法。這題沒有唯一標準答案。</strong><br>${x.sample}`;
 document.getElementById("next").style.display="inline-block";
}
function nextQ(){if(idx<data.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}else showResult()}
function showResult(){
 document.getElementById("questionArea").style.display="none";
 document.getElementById("bar").style.width="100%";
 document.getElementById("topCount").textContent="Completed";
 document.getElementById("result").style.display="block";
 document.getElementById("score").textContent=`${score} / 8`;
 let title=score>=7?"Excellent! 閱讀高手！":score>=6?"Great job! 表現很好！":score>=4?"Good effort! 再挑戰一次！":"Keep practicing! 再讀一次教材！";
 document.getElementById("resultTitle").textContent=title;
 document.getElementById("resultMsg").textContent="選擇題共 8 題；Q9–Q10 為開放式思辨與生活連結，不計入分數。";
 const names=[["Q1–Q2","直接提取",2,"l1"],["Q3–Q4","直接推論",2,"l2"],["Q5–Q7","詮釋整合",3,"l3"],["Q8","文本評估",1,"l4"]];
 document.getElementById("breakdown").innerHTML=names.map((n,i)=>`<div class="mini ${n[3]}"><b>${n[0]}</b><br>${n[1]}<br><strong>${levelScores[i]} / ${n[2]}</strong></div>`).join("");
 document.getElementById("r9").textContent=openAnswers[8]||"（未作答）";
 document.getElementById("r10").textContent=openAnswers[9]||"（未作答）";
}
</script>
</body></html>
