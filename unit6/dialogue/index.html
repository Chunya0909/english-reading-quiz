<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 6 | Christmas Shopping</title><style>:root{--a:#bd344e;--light:#fff0f0}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#233047;font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:850px;margin:32px auto;padding:20px}.panel{background:white;border:1px solid #e1e6ee;border-radius:25px;padding:clamp(20px,5vw,46px);box-shadow:0 12px 30px #2233440c}.tag{color:var(--a);font-weight:700;letter-spacing:2px}.title{font-size:clamp(28px,5vw,42px);margin:12px 0}p{line-height:1.7}.muted{color:#687891}.top{display:flex;justify-content:space-between;gap:12px}.progress{height:9px;background:#edf0f5;border-radius:20px;overflow:hidden;margin:24px 0}.bar{height:100%;background:var(--a);transition:width .2s}.option{display:block;width:100%;text-align:left;border:2px solid #e8ebf0;background:white;border-radius:15px;padding:17px 20px;margin:12px 0;font-size:17px;cursor:pointer;color:#243047}.option:hover:not(:disabled){border-color:var(--a);background:var(--light)}.option.correct{border-color:#00ae80;background:#e7fbf3}.option.wrong{border-color:#f04f68;background:#fff0f3}.option:disabled{cursor:default}.feedback{margin-top:18px;border-radius:15px;padding:18px;background:var(--light);line-height:1.7}button.action{background:var(--a);color:white;border:0;border-radius:40px;padding:13px 25px;font-size:17px;font-weight:700;cursor:pointer;margin-top:20px}button.secondary{background:#e9edf4;color:#233047;margin-right:10px}textarea{width:100%;min-height:160px;padding:17px;border:2px solid #e1e6ee;border-radius:14px;font-size:17px;resize:vertical}small{color:#687891}.hidden{display:none}a{color:var(--a)}</style></head><body><main><div class="panel"><div id="welcome"><div class="tag">UNIT 6 · Dialogue · PIRLS CHALLENGE</div><h1 class="title">Christmas Shopping</h1><p>八年級英文互動閱讀理解｜8 題四選一 + 2 題生活連結反思</p><p class="muted">作答後立即查看提示與課文證據。最後兩題沒有唯一標準答案。</p><button class="action" onclick="start()">開始挑戰 Start Quiz →</button><p><a href="../../index.html">← 返回 Unit 6 首頁</a></p></div><div id="quiz" class="hidden"><div class="top"><span class="tag" id="level"></span><span class="muted" id="count"></span></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="action hidden" onclick="advance()">下一題 Next →</button></div><div id="done" class="hidden"><div class="tag">CHALLENGE COMPLETE</div><h1>完成挑戰！</h1><h2 id="score"></h2><p>閱讀理解不只尋找答案，也要思考如何運用在自己的生活中。</p><button class="action" onclick="location.reload()">再挑戰一次</button><p><a href="../../index.html">← 返回 Unit 6 首頁</a></p></div></div></main><script>const questions=[{"q": "What party will Kim go to tonight?", "opts": ["A birthday party", "An ugly Christmas sweater party", "A school club party", "A New Year party"], "ans": 1, "evidence": "There will be an ugly Christmas sweater party tonight.", "level": "直接提取"}, {"q": "How much does the sweater cost?", "opts": ["NT$500", "NT$510", "NT$1,000", "NT$490"], "ans": 0, "evidence": "It costs five hundred NT dollars.", "level": "直接提取"}, {"q": "What does Cody suggest to help Jamie save money?", "opts": ["Buy two sweaters", "Wait until next year", "Give Kim his sweater from home", "Pay by card"], "ans": 2, "evidence": "I have a funny sweater at home. She can have it, and you can save some money.", "level": "直接提取"}, {"q": "Why does Jamie decide to buy the gloves?", "opts": ["They are the most expensive", "They are on sale, warm, and beautiful", "Kim wants them", "They are for the party"], "ans": 1, "evidence": "They're on sale. / And they are warm and beautiful.", "level": "直接推論"}, {"q": "How much change does Jamie receive after paying NT$1,000?", "opts": ["NT$510", "NT$500", "NT$490", "NT$590"], "ans": 2, "evidence": "The total is NT$510. Jamie pays one thousand dollars, so the change is NT$490.", "level": "直接推論"}, {"q": "What does Cody’s offer show about him?", "opts": ["He wants Jamie to spend more", "He is thoughtful and helpful", "He dislikes Christmas", "He works at the store"], "ans": 1, "evidence": "Cody offers his own sweater so Jamie can save money.", "level": "整合詮釋"}, {"q": "Which statement best describes Jamie’s shopping decisions?", "opts": ["She only buys expensive items", "She considers price and the people she cares about", "She refuses to buy gifts", "She buys everything she sees"], "ans": 1, "evidence": "Jamie thinks the sweater costs too much but buys warm gloves for her grandpa.", "level": "整合詮釋"}, {"q": "Which advice is best supported by this dialogue?", "opts": ["Always buy the first item", "Buy gifts without checking prices", "Consider needs, cost, and kindness before buying", "Only pay in cash"], "ans": 2, "evidence": "Jamie considers the sweater price, Cody offers to help, and Jamie finds gloves on sale.", "level": "批判評估"}, {"q": "Your friend wants to buy an expensive gift but has little money. What advice would you give?", "hint": "Think about budgets, discounts, and meaningful gifts.", "level": "生活連結", "open": true}, {"q": "Describe one way you could show care for a family member without spending much money.", "hint": "Give a specific example from your life.", "level": "批判思考與生活連結", "open": true}];let n=0,score=0,locked=false;const $=id=>document.getElementById(id);function start(){$('welcome').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){locked=false;let x=questions[n];$('level').textContent=x.level;$('count').textContent=`Question ${n+1} / ${questions.length}`;$('bar').style.width=`${n/questions.length*100}%`;$('question').textContent=x.q;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('answers').innerHTML='';if(x.open){let t=document.createElement('textarea');t.placeholder='請輸入你的想法... Type your thoughts here.';t.value=sessionStorage.getItem('u5-Dialogue-'+n)||'';t.oninput=()=>sessionStorage.setItem('u5-Dialogue-'+n,t.value);$('answers').append(t);$('feedback').textContent='Hint: '+x.hint;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}else{x.opts.forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent='ABCD'[i]+') '+v;b.onclick=()=>choose(i);$('answers').append(b)})}$('next').textContent=n===questions.length-1?'完成 Finish':'下一題 Next →'}function choose(i){if(locked)return;locked=true;let x=questions[n];if(i===x.ans)score++;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===x.ans)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(i===x.ans?'答對了！ ':'再想一想。 ')+ 'Text evidence: '+x.evidence;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}function advance(){if(!questions[n].open&&!locked)return;n++;if(n===questions.length){$('quiz').classList.add('hidden');$('done').classList.remove('hidden');$('score').textContent='選擇題答對 '+score+' / 8 題';return}render()}</script></body></html>
