<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 6 | The Ugly Truth Behind Beautiful Clothes</title><style>:root{--a:#26785a;--light:#eaf7ed}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#233047;font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:850px;margin:32px auto;padding:20px}.panel{background:white;border:1px solid #e1e6ee;border-radius:25px;padding:clamp(20px,5vw,46px);box-shadow:0 12px 30px #2233440c}.tag{color:var(--a);font-weight:700;letter-spacing:2px}.title{font-size:clamp(28px,5vw,42px);margin:12px 0}p{line-height:1.7}.muted{color:#687891}.top{display:flex;justify-content:space-between;gap:12px}.progress{height:9px;background:#edf0f5;border-radius:20px;overflow:hidden;margin:24px 0}.bar{height:100%;background:var(--a);transition:width .2s}.option{display:block;width:100%;text-align:left;border:2px solid #e8ebf0;background:white;border-radius:15px;padding:17px 20px;margin:12px 0;font-size:17px;cursor:pointer;color:#243047}.option:hover:not(:disabled){border-color:var(--a);background:var(--light)}.option.correct{border-color:#00ae80;background:#e7fbf3}.option.wrong{border-color:#f04f68;background:#fff0f3}.option:disabled{cursor:default}.feedback{margin-top:18px;border-radius:15px;padding:18px;background:var(--light);line-height:1.7}button.action{background:var(--a);color:white;border:0;border-radius:40px;padding:13px 25px;font-size:17px;font-weight:700;cursor:pointer;margin-top:20px}button.secondary{background:#e9edf4;color:#233047;margin-right:10px}textarea{width:100%;min-height:160px;padding:17px;border:2px solid #e1e6ee;border-radius:14px;font-size:17px;resize:vertical}small{color:#687891}.hidden{display:none}a{color:var(--a)}</style></head><body><main><div class="panel"><div id="welcome"><div class="tag">UNIT 6 · Reading · PIRLS CHALLENGE</div><h1 class="title">The Ugly Truth Behind Beautiful Clothes</h1><p>八年級英文互動閱讀理解｜8 題四選一 + 2 題生活連結反思</p><p class="muted">作答後立即查看提示與課文證據。最後兩題沒有唯一標準答案。</p><button class="action" onclick="start()">開始挑戰 Start Quiz →</button><p><a href="../../index.html">← 返回 Unit 6 首頁</a></p></div><div id="quiz" class="hidden"><div class="top"><span class="tag" id="level"></span><span class="muted" id="count"></span></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="action hidden" onclick="advance()">下一題 Next →</button></div><div id="done" class="hidden"><div class="tag">CHALLENGE COMPLETE</div><h1>完成挑戰！</h1><h2 id="score"></h2><p>閱讀理解不只尋找答案，也要思考如何運用在自己的生活中。</p><button class="action" onclick="location.reload()">再挑戰一次</button><p><a href="../../index.html">← 返回 Unit 6 首頁</a></p></div></div></main><script>const questions=[{"q": "What makes fast fashion attractive to customers?", "opts": ["High prices", "Low prices and nice designs", "Only handmade clothes", "Long production times"], "ans": 1, "evidence": "People now can buy new clothes with nice designs at low prices.", "level": "直接提取"}, {"q": "Where do some fast fashion companies move their factories?", "opts": ["To countries like India", "Only to Taiwan", "To the ocean", "To shopping malls"], "ans": 0, "evidence": "They move factories to countries like India for cheap workers.", "level": "直接提取"}, {"q": "How much does the text say some workers make per hour?", "opts": ["About NT$250", "About NT$25", "About NT$2.5", "About NT$500"], "ans": 2, "evidence": "A worker makes only about 2.5 NT dollars for an hour's work.", "level": "直接提取"}, {"q": "Why do many companies use polyester?", "opts": ["It is expensive", "It is cheap", "It is always natural", "It disappears in water"], "ans": 1, "evidence": "Most companies use polyester to make clothes because it is cheap.", "level": "直接推論"}, {"q": "How can washing polyester clothes harm the sea?", "opts": ["It makes clothes warmer", "It removes all pollution", "Small pieces come off and enter the sea", "It makes workers earn more"], "ans": 2, "evidence": "The polyester comes off the clothes little by little when you wash them. In the end, it goes into the sea.", "level": "直接推論"}, {"q": "Which two groups or things are harmed according to the passage?", "opts": ["Workers and the environment", "Teachers and tourists", "Shoppers and shopkeepers only", "Designers and singers"], "ans": 0, "evidence": "However, this is bad for the workers and the environment.", "level": "整合詮釋"}, {"q": "Why does the writer call the truth behind clothes “ugly”?", "opts": ["The clothes have ugly colors", "Low prices may hide unfair work and environmental damage", "All clothes are poorly designed", "People do not like shopping"], "ans": 1, "evidence": "Workers receive very low pay, and polyester pollution hurts the environment.", "level": "整合詮釋"}, {"q": "What is the author mainly encouraging readers to do?", "opts": ["Buy more clothes every week", "Avoid thinking about workers", "Think carefully before buying clothes", "Only choose polyester clothes"], "ans": 2, "evidence": "Stop for a second and think—do I really need them?", "level": "批判評估"}, {"q": "Have you ever bought clothes you did not really need? What influenced your decision?", "hint": "Think about advertisements, trends, friends, and your budget.", "level": "生活連結", "open": true}, {"q": "What are two realistic actions you could take to reduce the harm of fast fashion? Explain why.", "hint": "Consider wearing clothes longer, buying less, repairing, or reusing.", "level": "批判思考與生活連結", "open": true}];let n=0,score=0,locked=false;const $=id=>document.getElementById(id);function start(){$('welcome').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){locked=false;let x=questions[n];$('level').textContent=x.level;$('count').textContent=`Question ${n+1} / ${questions.length}`;$('bar').style.width=`${n/questions.length*100}%`;$('question').textContent=x.q;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('answers').innerHTML='';if(x.open){let t=document.createElement('textarea');t.placeholder='請輸入你的想法... Type your thoughts here.';t.value=sessionStorage.getItem('u5-Reading-'+n)||'';t.oninput=()=>sessionStorage.setItem('u5-Reading-'+n,t.value);$('answers').append(t);$('feedback').textContent='Hint: '+x.hint;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}else{x.opts.forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent='ABCD'[i]+') '+v;b.onclick=()=>choose(i);$('answers').append(b)})}$('next').textContent=n===questions.length-1?'完成 Finish':'下一題 Next →'}function choose(i){if(locked)return;locked=true;let x=questions[n];if(i===x.ans)score++;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===x.ans)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(i===x.ans?'答對了！ ':'再想一想。 ')+ 'Text evidence: '+x.evidence;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}function advance(){if(!questions[n].open&&!locked)return;n++;if(n===questions.length){$('quiz').classList.add('hidden');$('done').classList.remove('hidden');$('score').textContent='選擇題答對 '+score+' / 8 題';return}render()}</script></body></html>
